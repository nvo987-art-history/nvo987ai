name: NVO987 – Generate Prompt Library Once

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:

  generate:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate 1500 safe prompt pages
        run: |
          python tools/generate_prompts.py

      - name: Verify generated content
        run: |
          COUNT=$(find prompts -maxdepth 1 -type f -name "*.html" \
            ! -name "index.html" \
            ! -name "template.html" | wc -l)

          echo "Generated prompt HTML files: $COUNT"

          if [ "$COUNT" -ne 1500 ]; then
            echo "ERROR: Expected exactly 1500 prompt pages."
            exit 1
          fi

          if grep -R 'index, follow' prompts --include="*.html"; then
            echo "ERROR: An indexable generated prompt page was detected."
            exit 1
          fi

          if grep -R 'noindex' prompts --include="*.html" > /dev/null; then
            echo "NOINDEX validation passed."
          else
            echo "ERROR: NOINDEX validation failed."
            exit 1
          fi

          echo "Verification successful."

      - name: Commit generated pages
        run: |
          git config user.name "NVO987 Generator"
          git config user.email "actions@users.noreply.github.com"

          git add prompts sitemap.xml robots.txt

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Generate NVO987 1500 prompt library"
            git push
          fi
