name: Build NVO987 AI Prompt Pages

on:
  push:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generate pages
        run: python generate_site.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add index.html sitemap.xml robots.txt prompts/

          git diff --cached --quiet || git commit -m "Auto-build NVO987 AI prompt pages"
          git pull --rebase
          git push
